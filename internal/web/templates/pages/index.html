<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>music-dl - 聚合搜索与解析</title>
    <link rel="icon" href="{{.Root}}/icon.png" type="image/png">
    
    <link rel="stylesheet" href="{{.Root}}/style.css">
    <link rel="stylesheet" href="{{.Root}}/videogen.css">
    

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">

</head>
<body>

<!-- 下载中面板 -->
<div id="download-panel" class="download-panel" style="display:none;">
    <div class="download-panel-header">
        <span><i class="fa-solid fa-download"></i> 下载中</span>
        <span class="download-panel-close" onclick="closeDownloadPanel()">&times;</span>
    </div>
    <div class="download-panel-body" id="download-panel-body"></div>
    <div class="download-panel-footer" id="download-panel-footer"></div>
</div>

<!-- 换源中面板 -->
<div id="switch-panel" class="download-panel switch-panel" style="display:none;">
    <div class="download-panel-header switch-panel-header">
        <span><i class="fa-solid fa-arrows-rotate"></i> 换源中</span>
        <span class="download-panel-close" onclick="closeSwitchPanel()">&times;</span>
    </div>
    <div class="download-panel-body" id="switch-panel-body"></div>
    <div class="download-panel-footer" id="switch-panel-footer"></div>
</div>

<!-- 右侧工具栏 -->
<div class="right-toolbar">
    <!-- 功能按钮组 -->
    <div class="rt-btn" onclick="openSystemConfig()" title="系统配置" data-btn="settings"><i class="fa-solid fa-gear"></i></div>
    <form id="auth-float-form" class="rt-form" action="{{.Root}}/logout" method="post" title="登录" data-btn="auth">
        <button id="auth-float-button" type="submit"><i id="auth-float-icon" class="fa-solid fa-right-to-bracket"></i></button>
    </form>
    <div class="rt-btn" onclick="openImportSongsModal()" title="导入已有曲库" data-btn="import"><i class="fa-solid fa-file-import"></i></div>
    <div class="rt-btn" onclick="clearDownloadRecords()" title="清空下载记录" data-btn="clear"><i class="fa-solid fa-trash-can"></i></div>

    <div class="rt-separator" id="sep-nav"></div>

    <!-- 浏览器导航 + 翻页按钮组 -->
    <div class="rt-btn" onclick="window.history.back()" title="返回" data-btn="back"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="rt-btn" onclick="window.history.forward()" title="向前" data-btn="forward"><i class="fa-solid fa-chevron-right"></i></div>
    <div class="rt-btn" onclick="floatPageUp()" title="上一页" data-btn="pageUp"><i class="fa-solid fa-chevron-up"></i></div>
    <div class="rt-page-num" id="float-page-num" onclick="floatPageNumClick()" data-btn="pageNum">1</div>
    <div class="rt-btn" onclick="floatPageDown()" title="下一页" data-btn="pageDown"><i class="fa-solid fa-chevron-down"></i></div>

    <div class="rt-separator" id="sep-scroll"></div>

    <!-- 滚动按钮组 -->
    <div class="rt-btn" onclick="scrollToTop()" title="回到顶部" data-btn="scrollTop"><i class="fa-solid fa-arrow-up"></i></div>
    <div class="rt-btn" onclick="scrollToBottom()" title="回到底部" data-btn="scrollBottom"><i class="fa-solid fa-arrow-down"></i></div>
</div>

<div class="container">
    {{template "search_box" .}}

    {{template "playlist_categories" .}}

    {{template "playlist_source_tabs" .}}

    {{template "playlist_grid" .}}

    {{template "song_list" .}}
</div>

{{template "modals" .}}



<script>
    window.API_ROOT = "{{.Root}}";
</script>

<script src="{{.Root}}/app.js"></script>
{{template "videogen_modal" .}}
<script src="{{.Root}}/videogen.js"></script>


</div>



</body>
</html>
