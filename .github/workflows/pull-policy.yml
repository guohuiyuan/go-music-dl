name: 拉取请求标题检查
on:
  pull_request_target:
    types: [opened, edited, reopened]

# This trusted workflow only uses PR metadata; never check out or run fork code.
permissions:
  pull-requests: write

jobs:
  close-pr:
    name: closepr
    if: contains(github.event.pull_request.title, '.go')
    runs-on: ubuntu-latest
    steps:
      - name: Close PR if title contains ".go"
        uses: superbrothers/close-pull-request@v3
        with:
          comment: "非法PR. 请`fork`后修改自己的仓库, 而不是向主仓库提交更改. 如果您确信您的PR是为了给主仓库新增功能或修复bug, 请更改默认PR标题. **注意**: 如果您再次触发本提示, 则有可能导致账号被封禁."
